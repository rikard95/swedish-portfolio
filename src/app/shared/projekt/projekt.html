<!-- GitHub Repositories Section -->
<div class="max-w-[900px] w-[90%] mx-auto mt-10 mb-12">
  <h2 class="text-xl sm:text-2xl font-bold text-slate-100 mb-4">Mina GitHub-projekt</h2>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
    @for (projekt of githubProjekter; track projekt.githubUrl) {
      <div class="bg-slate-800/50 dark:bg-slate-800/50 backdrop-blur-sm border border-slate-700 dark:border-slate-700 rounded-xl p-4 sm:p-6 transition-all hover:border-blue-500 dark:hover:border-blue-500 hover:shadow-glow flex flex-col gap-3">

        <!-- Name & language -->
        <div class="flex items-start justify-between gap-2">
          <div class="text-base sm:text-lg font-semibold text-slate-100 dark:text-slate-100">
            {{ projekt.namn }}
          </div>
          <span class="shrink-0 flex items-center gap-1 text-xs text-slate-500 dark:text-slate-500">
            <span class="inline-block w-2 h-2 rounded-full bg-blue-400"></span>
            {{ projekt.sprak }}
          </span>
        </div>

        <!-- Description -->
        <div class="text-sm text-slate-400 dark:text-slate-400 leading-snug flex-1">
          {{ projekt.beskrivning }}
        </div>

        <!-- Action buttons -->
        <div class="flex flex-wrap gap-2 mt-auto pt-1">
          @if (projekt.demoUrl) {
            <a
              [href]="projekt.demoUrl"
              target="_blank"
              rel="noopener noreferrer"
              class="inline-flex items-center gap-1 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium px-3 py-1.5 transition-colors no-underline"
            >
              Visa demo ↗
            </a>
          } @else {
            <span class="inline-flex items-center rounded-lg bg-slate-700/60 text-slate-400 text-xs font-medium px-3 py-1.5 cursor-default">
              Ej driftsatt
            </span>
          }
          <a
            [href]="projekt.githubUrl"
            target="_blank"
            rel="noopener noreferrer"
            class="inline-flex items-center gap-1 rounded-lg border border-slate-600 hover:border-blue-400 text-slate-300 hover:text-blue-400 text-xs font-medium px-3 py-1.5 transition-colors no-underline"
          >
            Se kod ↗
          </a>
        </div>
      </div>
    }
  </div>
</div>
